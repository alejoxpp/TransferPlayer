name: Sync Football Data

on:
  schedule:
    # Daily at 03:00 UTC (avoid API rate limits)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to sync (e.g., 2024)'
        required: false
        type: string
      dry_run:
        description: 'Run without saving to DB'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  sync:
    name: Sync Transfers from API-Football
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_HOST: v3.football.api-sports.io
          APP_ENV: production
        run: |
          python -m scripts.sync_football_data \
            --season ${{ github.event.inputs.season || github.event.schedule == '0 3 * * *' && '$(date +%Y)' || '' }} \
            --dry-run ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *TransferPlayer Sync Failed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *TransferPlayer Sync Failed*\n*Repo:* ${{ github.repository }}\n*Run:* ${{ github.run_id }}\n*Error:* Check Actions for details"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify on success (optional)
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *TransferPlayer Sync Completed*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *TransferPlayer Sync Completed*\n*Repo:* ${{ github.repository }}\n*Run:* ${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true