name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-streamlit-cloud:
    name: Deploy to Streamlit Cloud
    runs-on: ubuntu-latest
    if: github.repository == 'alejoxpp/TransferPlayer'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Streamlit Cloud deploy
        uses: streamlit/streamlit-cloud-deploy-action@v1
        with:
          app-name: transferplayer
          repo: alejoxpp/TransferPlayer
          branch: main
          env-vars: |
            NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}
            DB_NAME=transferplayer
            FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
            FOOTBALL_API_HOST=v3.football.api-sports.io
            APP_ENV=production

  deploy-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.repository == 'alejoxpp/TransferPlayer'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alejoxpp/transferplayer
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-streamlit-cloud, deploy-docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG_TEMP.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_TEMP.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false